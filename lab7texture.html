<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Three.js Living Room</title>

	<style>
		body {
			margin: 0;
			overflow: hidden;
			font-family: Arial, sans-serif;
		}

		.scene-controls {
			position: absolute;
			top: 15px;
			left: 15px;
			display: flex;
			gap: 8px;
			z-index: 100;
		}

		.scene-controls button {
			padding: 10px 15px;
			cursor: pointer;
		}
	</style>
</head>

<body>

	<div class="scene-controls">
		<button id="toggleLight" type="button">Toggle Lights</button>
		<button id="toggleFan" type="button" aria-pressed="true">Fan: On</button>
		<button id="toggleLamp" type="button" aria-pressed="true">Lamp: On</button>
	</div>

	<script type="module" src="lab7texture.js"></script>

</body>
</html>
